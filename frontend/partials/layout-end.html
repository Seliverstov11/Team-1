  <svg class="size-5 shrink-0 text-brand-gold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>

<!-- ===================== Окно «Количество» =====================
     Одно поле на странице: Enter или «Готово» применяют и закрывают клавиатуру -->
<div x-data x-show="$store.qtySheet.p" x-cloak class="fixed inset-0 z-50 grid items-end sm:place-items-center" @keydown.escape.window="$store.qtySheet.close()">
  <div class="absolute inset-0 bg-ink/45 backdrop-blur-[2px]" @click="$store.qtySheet.close()" aria-hidden="true"></div>
  <form x-show="$store.qtySheet.p" x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="translate-y-full sm:translate-y-4 sm:opacity-0"
        class="relative w-full rounded-t-[1.5rem] bg-surface px-5 pb-[calc(1.25rem+env(safe-area-inset-bottom))] pt-4 shadow-lift sm:max-w-sm sm:rounded-panel sm:pb-5"
        role="dialog" aria-modal="true" aria-labelledby="qty-title" novalidate @submit.prevent="$store.qtySheet.apply()">
    <div class="mx-auto mb-3 h-1 w-10 rounded-full bg-line sm:hidden" aria-hidden="true"></div>
    <template x-if="$store.qtySheet.p">
      <div>
        <p id="qty-title" class="eyebrow" x-text="$store.qtySheet.mode === 'cart' ? 'Количество в корзине' : 'Сколько положить в корзину'"></p>
        <p class="mt-2 line-clamp-2 text-sm" x-text="$store.qtySheet.p.name"></p>
        <p class="mt-0.5 text-[0.6875rem] font-light text-ink-muted" x-text="`В наличии: ${$store.qtySheet.max} ${$store.qtySheet.p.unit}`"></p>
        <div class="mt-4 flex items-center gap-2">
          <button type="button" class="grid size-12 shrink-0 place-items-center rounded-control bg-brand-light text-xl" @click="$store.qtySheet.step(-1)" aria-label="Меньше">−</button>
          <label class="relative flex-1">
            <span class="sr-only">Количество</span>
            <input id="qty-sheet-input" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off"
                   x-model="$store.qtySheet.value" @focus="$event.target.select()"
                   class="h-12 w-full rounded-control border border-line text-center font-heading text-[1.75rem] font-semibold outline-none focus:border-brand-gold" />
            <span class="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-sm text-ink-muted" x-text="$store.qtySheet.p.unit"></span>
          </label>
          <button type="button" class="grid size-12 shrink-0 place-items-center rounded-control bg-brand-light text-xl" @click="$store.qtySheet.step(1)" aria-label="Больше">+</button>
        </div>
        <div x-show="$store.qtySheet.quick.length" class="mt-3 flex flex-wrap gap-2">
          <template x-for="v in $store.qtySheet.quick" :key="v">
            <button type="button" class="chip" :class="$store.qtySheet.n === v && 'is-active'" @click="$store.qtySheet.value = String(v)" x-text="v"></button>
          </template>
          <button type="button" class="chip" @click="$store.qtySheet.value = String($store.qtySheet.max)" x-text="`все ${$store.qtySheet.max}`"></button>
        </div>
        <p x-show="Number($store.qtySheet.value) > $store.qtySheet.max" class="mt-2 text-[0.6875rem] text-status-confirmed" x-text="`Больше нет — положим ${$store.qtySheet.max}`"></p>
        <div class="mt-5 grid grid-cols-[auto_1fr] gap-3">
          <button type="button" class="btn-outline" @click="$store.qtySheet.close()">Отмена</button>
          <button type="submit" class="btn-primary" :disabled="$store.qtySheet.mode === 'add' && !$store.qtySheet.n"
                  x-text="$store.qtySheet.mode === 'cart' ? ($store.qtySheet.n ? 'Готово' : 'Убрать из корзины') : `В корзину · ${$store.qtySheet.n} ${$store.qtySheet.p.unit}`"></button>
        </div>
      </div>
    </template>
  </form>
</div>

<!-- ===================== Окно «Сообщить о поступлении» ===================== -->
<div x-data x-show="$store.restock.p" x-cloak class="fixed inset-0 z-50 grid items-end sm:place-items-center" @keydown.escape.window="$store.restock.close()">
  <div class="absolute inset-0 bg-ink/45 backdrop-blur-[2px]" @click="$store.restock.close()" aria-hidden="true"></div>
  <form x-show="$store.restock.p" x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="translate-y-full sm:translate-y-4 sm:opacity-0"
        class="relative w-full rounded-t-[1.5rem] bg-surface px-5 pb-[calc(1.25rem+env(safe-area-inset-bottom))] pt-4 shadow-lift sm:max-w-sm sm:rounded-panel sm:pb-5"
        role="dialog" aria-modal="true" aria-labelledby="restock-title" novalidate @submit.prevent="$store.restock.submit()">
    <div class="mx-auto mb-3 h-1 w-10 rounded-full bg-line sm:hidden" aria-hidden="true"></div>
    <template x-if="$store.restock.p && !$store.restock.done">
      <div class="flex flex-col gap-3">
        <div>
          <p id="restock-title" class="eyebrow">Сообщить о поступлении</p>
          <p class="mt-2 line-clamp-2 text-sm" x-text="$store.restock.p.name"></p>
          <p class="mt-1 text-[0.75rem] font-light text-ink-muted">Сейчас нет в наличии. Оставьте телефон — менеджер позвонит, когда товар привезут. Это не заказ и не предоплата</p>
        </div>
        <input type="text" x-model="$store.restock.form.name" class="field" placeholder="Ваше имя" autocomplete="name" aria-label="Имя" />
        <input type="tel" x-model="$store.restock.form.phone" @input="$store.restock.form.phone = $store.fmt.phone($store.restock.form.phone)" class="field" placeholder="+7 (7XX) XXX-XX-XX" autocomplete="tel" aria-label="Телефон" />
        <input type="text" inputmode="numeric" x-model="$store.restock.form.qty" class="field" :placeholder="`Сколько нужно, ${$store.restock.p.unit} (необязательно)`" aria-label="Сколько нужно" enterkeyhint="send" />
        <p x-show="$store.restock.error" class="rounded-xl bg-error-soft px-4 py-2.5 text-xs text-error" x-text="$store.restock.error"></p>
        <div class="mt-1 grid grid-cols-[auto_1fr] gap-3">
          <button type="button" class="btn-outline" @click="$store.restock.close()">Отмена</button>
          <button type="submit" class="btn-primary" :disabled="$store.restock.busy" x-text="$store.restock.busy ? 'Отправляем…' : 'Сообщите мне'"></button>
        </div>
      </div>
    </template>
    <template x-if="$store.restock.p && $store.restock.done">
      <div class="py-2 text-center">
        <span class="mx-auto grid size-12 place-items-center rounded-full bg-success-soft text-success">
          <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
        <p class="mt-3 font-heading text-[1.375rem] font-medium">Сообщим о поступлении</p>
        <p class="mt-1 text-[0.8125rem] font-light text-ink-muted" x-text="`Позвоним на ${$store.restock.form.phone}, когда «${$store.restock.p.name}» снова будет в наличии`"></p>
        <button type="button" class="btn-primary mt-5 w-full" @click="$store.restock.close()">Понятно</button>
      </div>
    </template>
  </form>
</div>
