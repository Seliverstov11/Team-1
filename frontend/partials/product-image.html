<!-- Фото заказчик не передал: в данных только будущее имя файла (image_name). Пока — заглушка по разделу каталога, не «битая картинка» -->
<div class="absolute inset-0" x-data="{ broken: false }"
     :class="{ ingredients: 'bg-media-ingredients', decor: 'bg-media-decor', box: 'bg-media-packaging', board: 'bg-brand-gold-soft', bag: 'bg-media-packaging', other: 'bg-surface-sand' }[bl.groupMedia(p.category_id)]">
  <template x-if="p.image_url && !broken"><img :src="p.image_url" :alt="p.name" class="size-full object-cover" loading="lazy" @error="broken = true" /></template>
  <template x-if="!p.image_url || broken">
    <div class="absolute inset-0 grid place-items-center" :title="p.image_name ? `Фото будет: ${p.image_name}` : ''">
      <template x-if="bl.groupMedia(p.category_id) === 'ingredients'"><svg viewBox="0 0 120 100" class="w-1/2" aria-hidden="true"><rect x="22" y="28" width="70" height="30" rx="2" fill="#5a3326"/><path d="M45 28v30M68 28v30M22 43h70" stroke="#47271d" stroke-width="2"/><rect x="22" y="56" width="70" height="5" fill="#9a7b43"/><rect x="22" y="61" width="70" height="22" rx="2" fill="#c9a15a"/><circle cx="96" cy="28" r="9" fill="#7a4a38"/><circle cx="104" cy="40" r="5" fill="#7a4a38"/></svg></template>
      <template x-if="bl.groupMedia(p.category_id) === 'box'"><svg viewBox="0 0 120 100" class="w-1/2" aria-hidden="true"><rect x="30" y="38" width="60" height="44" fill="#fff" stroke="#d9d3c6"/><rect x="56" y="38" width="8" height="44" fill="#c9a15a"/><rect x="30" y="34" width="60" height="8" fill="#f2ebda" stroke="#d9d3c6"/><path d="M60 34c-6-14-20-10-12-2M60 34c6-14 20-10 12-2" fill="none" stroke="#c9a15a" stroke-width="3"/></svg></template>
      <template x-if="bl.groupMedia(p.category_id) === 'decor'"><svg viewBox="0 0 120 100" class="w-1/2" aria-hidden="true"><rect x="38" y="36" width="8" height="48" rx="2" fill="#efe3c4"/><rect x="56" y="28" width="8" height="56" rx="2" fill="#e8d3a7"/><rect x="74" y="40" width="8" height="44" rx="2" fill="#9db08a"/><path d="M42 30c-3-5 0-8 0-8s3 3 0 8M60 22c-3-5 0-8 0-8s3 3 0 8M78 34c-3-5 0-8 0-8s3 3 0 8" fill="#c9a15a"/></svg></template>
      <template x-if="bl.groupMedia(p.category_id) === 'board'"><svg viewBox="0 0 120 100" class="w-1/2" aria-hidden="true"><ellipse cx="60" cy="60" rx="40" ry="11" fill="#c9a15a"/><ellipse cx="60" cy="57" rx="40" ry="11" fill="#e3c98d"/><ellipse cx="60" cy="57" rx="30" ry="7" fill="none" stroke="#c9a15a" stroke-width="1.5"/></svg></template>
      <template x-if="bl.groupMedia(p.category_id) === 'bag'"><svg viewBox="0 0 120 100" class="w-1/2" aria-hidden="true"><path d="M38 34h44l6 52H32z" fill="#fff" stroke="#d9d3c6"/><path d="M48 40v-8a12 12 0 0 1 24 0v8" fill="none" stroke="#c9a15a" stroke-width="3"/></svg></template>
      <template x-if="bl.groupMedia(p.category_id) === 'other'"><svg viewBox="0 0 120 100" class="w-1/2" aria-hidden="true"><rect x="34" y="26" width="52" height="60" rx="3" fill="#fff" stroke="#d9d3c6"/><path d="M44 42h32M44 52h32M44 62h20" stroke="#c9a15a" stroke-width="3"/></svg></template>
      <span class="absolute inset-x-0 bottom-2 text-center text-[0.5625rem] tracking-wider text-ink-muted/80">фото подбираем</span>
    </div>
  </template>
</div>
