<!-- Покупка. Пока товара нет в корзине: выбрать количество и «В корзину».
     Уже в корзине: −/+ меняют количество прямо в корзине, кнопка ведёт в корзину (повторное нажатие не добавляет ещё).
     Нет в наличии (available_qty = 0) — добавить нельзя: кнопка неактивна, количества нет -->
<template x-if="!$store.cart.qty(p.id)">
  <div>
    <div class="flex h-10 items-center justify-between rounded-control bg-brand-light px-1" x-show="$store.cart.left(p) > 0">
      <button type="button" @click="n = Math.max(1, n - 1)" :disabled="n <= 1" aria-label="Меньше"
              class="grid size-8 place-items-center rounded-lg text-base transition enabled:hover:bg-surface disabled:text-ink-placeholder">−</button>
      <!-- Количество можно вписать с клавиатуры (100 упаковок — не 100 нажатий) -->
      <label class="flex min-w-0 items-center justify-center gap-1 text-[0.8125rem] font-medium">
        <input type="number" inputmode="numeric" min="1" :max="$store.cart.left(p)" :value="Math.min(n, $store.cart.left(p))"
               @focus="$event.target.select()" @change="n = Math.max(1, Math.min(Math.floor(Number($event.target.value) || 1), $store.cart.left(p))); $event.target.value = n"
               @keydown.enter.prevent="$event.target.blur()"
               class="qty-input w-14 rounded-md bg-transparent py-1 text-center outline-none focus:bg-surface" :aria-label="`Количество, ${p.unit}`" />
        <span class="shrink-0 text-ink-muted" x-text="p.unit"></span>
      </label>
      <button type="button" @click="n = Math.min(n + 1, $store.cart.left(p))" :disabled="n >= $store.cart.left(p)" aria-label="Больше"
              class="grid size-8 place-items-center rounded-lg text-base transition enabled:hover:bg-surface disabled:text-ink-placeholder">+</button>
    </div>
    <button type="button" class="btn-outline mt-2.5 h-auto min-h-11 w-full whitespace-normal py-2 text-center leading-snug max-sm:px-2 max-sm:tracking-[0.08em]"
            :disabled="!bl.inStock(p) || $store.cart.left(p) < 1"
            @click="$store.cart.add(p, Math.min(n, $store.cart.left(p))); $store.cart.added(p); n = 1"
            x-text="bl.inStock(p) ? 'В корзину' : 'Нет в наличии'"></button>
  </div>
</template>
<template x-if="$store.cart.qty(p.id)">
  <div>
    <div class="flex h-10 items-center justify-between rounded-control border border-brand-gold-light bg-brand-gold-soft px-1">
      <button type="button" @click="$store.cart.qty(p.id) > 1 ? $store.cart.set(p, $store.cart.qty(p.id) - 1) : $store.cart.remove(p.id)"
              :aria-label="$store.cart.qty(p.id) > 1 ? 'Убрать одну' : 'Убрать из корзины'"
              class="grid size-8 place-items-center rounded-lg text-base transition hover:bg-surface">−</button>
      <label class="flex min-w-0 items-center justify-center gap-1 text-[0.8125rem] font-medium">
        <span class="shrink-0 text-ink-muted max-[380px]:hidden">В корзине</span>
        <input type="number" inputmode="numeric" min="0" :max="$store.cart.qty(p.id) + $store.cart.left(p)" :value="$store.cart.qty(p.id)"
               @focus="$event.target.select()" @keydown.enter.prevent="$event.target.blur()"
               @change="Number($event.target.value) > 0 ? $store.cart.set(p, $event.target.value) : $store.cart.remove(p.id); $event.target.value = $store.cart.qty(p.id) || ''"
               class="qty-input w-14 rounded-md bg-transparent py-1 text-center outline-none focus:bg-surface" :aria-label="`В корзине, ${p.unit}`" />
        <span class="shrink-0 text-ink-muted" x-text="p.unit"></span>
      </label>
      <button type="button" @click="$store.cart.set(p, $store.cart.qty(p.id) + 1)" :disabled="$store.cart.left(p) < 1"
              :aria-label="$store.cart.left(p) < 1 ? 'В корзине весь остаток' : 'Добавить одну'"
              class="grid size-8 place-items-center rounded-lg text-base transition enabled:hover:bg-surface disabled:text-ink-placeholder">+</button>
    </div>
    <a href="/cart.html" class="btn-primary mt-2.5 hover:border-brand-dark-hover hover:bg-brand-dark-hover h-auto min-h-11 w-full whitespace-normal py-2 text-center leading-snug max-sm:px-2 max-sm:tracking-[0.08em]">Перейти в корзину →</a>
    <p x-show="$store.cart.left(p) < 1" class="mt-1.5 text-center text-[0.6875rem] text-ink-muted">В корзине весь остаток</p>
  </div>
</template>
