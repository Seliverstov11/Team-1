<!doctype html>
<html lang="ru">
<head>
  <!-- @include head.html -->
  <title>Каталог — Bakeloom</title>
</head>
<body data-page="catalog">
<!-- @include layout-start.html -->

<main id="main" x-data="catalogPage" class="vt-content flex flex-col gap-6">
  <nav class="text-xs font-light text-ink-muted" aria-label="Хлебные крошки">
    <a href="/" class="hover:text-brand-gold">Главная</a> <span class="mx-1.5">/</span> <span class="text-ink">Каталог</span>
  </nav>

  <div class="flex items-end justify-between gap-6">
    <div>
      <p class="eyebrow" x-text="category && currentSection && currentSection.items.length > 1 ? currentSection.name : 'Каталог'">Каталог</p>
      <h1 class="mt-3 font-heading text-[clamp(2rem,5vw,2.5rem)] font-medium leading-none" x-text="title">Все товары</h1>
    </div>
    <p class="shrink-0 pb-1 text-[0.8125rem] font-light text-ink-muted" x-show="$store.shop.ready"
       x-text="`${list.length} ${$store.fmt.plural(list.length, 'товар', 'товара', 'товаров')}`"></p>
  </div>

  <!-- Фильтры в две ступени: раздел, затем категория внутри раздела -->
  <div class="card flex flex-col gap-3 px-4 py-3">
    <div class="flex flex-wrap gap-2" role="group" aria-label="Раздел">
      <button type="button" class="chip" :class="!section && 'is-active'" @click="section = ''; category = ''">Все</button>
      <template x-for="s in $store.shop.sections" :key="s.id">
        <button type="button" class="chip" :class="section === s.id && 'is-active'" :aria-pressed="section === s.id"
                @click="s.items.length > 1 ? pickSection(s.id) : (section = s.id, category = category === s.items[0].slug ? '' : s.items[0].slug)">
          <span x-text="s.name"></span>
          <span class="ml-1 opacity-60" x-text="$store.shop.countIn(s.items.map(i => i.id))"></span>
        </button>
      </template>
    </div>
    <div x-show="currentSection && currentSection.items.length > 1" x-cloak
         class="flex flex-wrap gap-2 border-t border-line pt-3" role="group" aria-label="Категория">
      <button type="button" class="chip" :class="!category && 'is-active'" @click="category = ''" x-text="`Весь раздел`"></button>
      <template x-for="c in currentSection?.items ?? []" :key="c.id">
        <button type="button" class="chip" :class="category === c.slug && 'is-active'" :aria-pressed="category === c.slug" @click="pickCategory(c.slug)">
          <span x-text="c.name"></span><span class="ml-1 opacity-60" x-text="$store.shop.countIn([c.id])"></span>
        </button>
      </template>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-4 border-t border-line pt-3">
      <label class="flex items-center gap-2 text-[0.8125rem] font-light">
        <input type="checkbox" x-model="onlyInStock" class="accent-brand-dark" /> Только в наличии
      </label>
      <div class="flex items-center gap-4">
        <button type="button" x-show="hasFilters" x-cloak @click="reset()"
                class="caps border-b border-ink pb-0.5 text-[0.625rem] tracking-[0.18em]">Сбросить</button>
        <label class="flex min-w-0 items-center gap-2 text-[0.8125rem] font-light text-ink-muted">
          <span class="max-sm:sr-only">Сортировка</span>
          <select x-model="sort" class="h-10 min-w-0 rounded-control border border-line bg-brand-light px-3 text-[0.8125rem] text-ink outline-none focus:border-brand-gold">
            <option value="">По названию</option>
            <option value="price-asc">Сначала дешевле</option>
            <option value="price-desc">Сначала дороже</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <p x-show="$store.search.q.trim()" x-cloak class="-mt-2 text-[0.8125rem] font-light text-ink-muted">
    Поиск: «<span class="text-ink" x-text="$store.search.q.trim()"></span>» — по названию, артикулу и фасовке
  </p>

  <!-- @include loading.html -->

  <div x-show="$store.shop.ready && !$store.shop.error && !list.length" x-cloak class="card px-8 py-14 text-center">
    <p class="font-heading text-[1.625rem]">Ничего не нашлось</p>
    <p class="mt-2 text-sm font-light text-ink-muted">Попробуйте изменить запрос или выбрать другой раздел</p>
    <button type="button" class="btn-outline mt-6" @click="reset()">Показать все товары</button>
  </div>

  <div x-data="{ get cards() { return page } }">
    <!-- @include product-grid.html -->
  </div>
  <div x-show="list.length > shown" x-cloak class="text-center">
    <button type="button" class="btn-outline" @click="shown += 48" x-text="`Показать ещё (${list.length - shown})`"></button>
  </div>
</main>

<!-- @include layout-end.html -->
</body>
</html>
