# Цветовая палитра Bakeloom — единственный источник цветов сайта.
#
# Откуда: Figma «Сладкий мастер — макет сайта» → страница «🌿 UI-кит · Минималистичный & Премиум»,
# локальные стили цвета «Премиум/…». Где стиля в Figma нет — указан компонент или макет-источник.
#
# Как устроено:
#   [группа.оттенок]  →  класс Tailwind  bg-группа-оттенок / text-группа-оттенок / border-…
#   оттенок DEFAULT   →  класс без суффикса: [error.DEFAULT] → text-error
# tailwind.config.js читает этот файл при сборке; править цвета нужно только здесь.
# Наглядно вся палитра — на странице /tokens.html.

# ---------------------------------------------------------------- Фирменные
[brand.dark]
hex = "#4A5236"
figma = "Премиум/Primary/Olive"
usage = "Основной цвет: кнопки, меню, баннер"

[brand.dark-hover]
hex = "#3A4129"
figma = "Премиум/Primary/Olive Dark"
usage = "Hover основной кнопки, низ градиентов"

[brand.dark-raised]
hex = "#56603F"
figma = "Пример главной — градиент баннера"
usage = "Верх градиента баннера"

[brand.dark-inset]
hex = "#555E40"
figma = "Пример главной — плашка на баннере"
usage = "Плашка-иллюстрация на баннере"

[brand.dark-soft]
hex = "#E6E8DC"
figma = "Премиум/Primary/Olive Soft"
usage = "Светлая подложка в тон основному"

[brand.light]
hex = "#F7F4EC"
figma = "Премиум/Surface/Ivory"
usage = "Фон страницы"

[brand.gold]
hex = "#B8975A"
figma = "Премиум/Accent/Gold"
usage = "Акцент: рамки, подписи-«капс», счётчики"

[brand.gold-hover]
hex = "#9A7B43"
figma = "Премиум/Accent/Gold Dark"
usage = "Hover золотой кнопки"

[brand.gold-light]
hex = "#D9C499"
