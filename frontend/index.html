<!doctype html>
<html lang="ru">
<head>
  <!-- @include head.html -->
  <title>Bakeloom — товары для кондитеров</title>
</head>
<body data-page="home">
<!-- @include layout-start.html -->

<main id="main" class="vt-content flex flex-col gap-8">
  <!-- Баннер -->
  <section class="overflow-hidden rounded-panel bg-linear-to-br from-brand-dark-raised to-brand-dark-hover">
    <div class="grid grid-cols-1 items-center gap-10 px-6 py-10 sm:py-14 sm:pl-[clamp(2rem,4vw,3.5rem)] sm:pr-10 min-[75rem]:grid-cols-[minmax(0,1fr)_auto]">
      <div class="max-w-[35rem]">
        <p class="eyebrow">Для кондитеров</p>
        <h1 class="mt-5 text-balance font-heading text-[clamp(2.125rem,3.6vw,3.25rem)] font-light leading-[1.15] text-brand-light">
          Натуральные ингредиенты для&nbsp;изысканных десертов
        </h1>
        <p class="mt-5 max-w-[26rem] text-[0.9375rem] font-light leading-relaxed text-on-dark-subtle">
          Ингредиенты, упаковка, декор и инструменты — всё для кондитерской в одном каталоге
        </p>
        <a href="/catalog.html" class="caps mt-8 inline-flex h-11 items-center gap-3 rounded-control border border-brand-gold px-6 text-xs text-brand-gold-light transition hover:bg-brand-gold/10">
          Смотреть каталог
          <svg class="size-3" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 3 5 5-5 5"/></svg>
        </a>
      </div>
      <div class="hidden rounded-panel border border-brand-gold/70 p-4 min-[75rem]:block" aria-hidden="true">
        <div class="grid aspect-square w-[min(18.75rem,24vw)] place-items-center rounded-2xl bg-brand-dark-inset">
          <svg viewBox="0 0 200 170" class="w-[63%]">
            <rect x="20" y="24" width="140" height="68" rx="4" fill="#5a3326"/>
            <path d="M66 24v68M113 24v68M20 58h140" stroke="#47271d" stroke-width="3"/>
            <rect x="20" y="88" width="140" height="10" fill="#9a7b43"/>
            <rect x="20" y="98" width="140" height="62" rx="4" fill="#d9c499"/>
            <circle cx="168" cy="22" r="18" fill="#7a4a38"/>
            <circle cx="188" cy="48" r="9" fill="#7a4a38"/>
          </svg>
        </div>
      </div>
    </div>
  </section>

  <!-- Разделы каталога (23 категории сгруппированы) -->
  <section aria-label="Разделы каталога" class="grid grid-cols-2 gap-3 sm:gap-5 md:grid-cols-4">
    <template x-for="s in $store.shop.sections" :key="s.id">
      <a :href="s.items.length > 1 ? `/catalog.html?section=${s.id}` : `/catalog.html?category=${s.items[0].slug}`"
         class="card flex flex-col items-center border border-transparent px-3 py-6 text-center transition hover:border-brand-gold-light sm:px-4 sm:py-7">
        <span class="grid size-16 place-items-center rounded-full border border-brand-gold-light bg-brand-gold-soft text-ink">
          <!-- @include category-icon.html -->
        </span>
        <span class="caps mt-5 text-[0.6875rem] tracking-[0.18em]" x-text="s.name"></span>
        <span class="mt-2 text-xs font-light text-ink-muted"
              x-text="`${$store.shop.countIn(s.items.map(i => i.id))} ${$store.fmt.plural($store.shop.countIn(s.items.map(i => i.id)), 'товар', 'товара', 'товаров')}`"></span>
      </a>
    </template>
  </section>

  <!-- Данных о продажах пока нет: показываем товары с несколькими фасовками -->
  <section x-data="{ get cards() { return $store.shop.cards.filter(c => c.multi && c.inStock).slice(0, 8) } }">
    <div class="mb-6 flex items-end justify-between gap-4 sm:mb-8 sm:gap-6">
      <div>
        <p class="eyebrow">Разные фасовки</p>
        <h2 class="mt-3 font-heading text-[clamp(2rem,5vw,2.5rem)] font-medium leading-none">Выбирайте фасовку</h2>
      </div>
      <a href="/catalog.html" class="caps shrink-0 border-b border-ink pb-0.5 text-[0.625rem] tracking-[0.18em] hover:text-brand-gold">Весь каталог</a>
    </div>
    <!-- @include loading.html -->
    <!-- @include product-grid.html -->
  </section>
</main>

<!-- @include layout-end.html -->
</body>
</html>
