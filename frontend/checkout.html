<!doctype html>
<html lang="ru">
<head>
  <!-- @include head.html -->
  <title>Оформление заказа — Bakeloom</title>
</head>
<body data-page="checkout">
<!-- @include layout-start.html -->

<main id="main" x-data="checkoutPage" class="vt-content flex flex-col gap-6">
  <nav class="text-xs font-light text-ink-muted" aria-label="Хлебные крошки">
    <a href="/" class="hover:text-brand-gold">Главная</a> <span class="mx-1.5">/</span>
    <a href="/cart.html" class="hover:text-brand-gold">Корзина</a> <span class="mx-1.5">/</span>
    <span class="text-ink">Оформление</span>
  </nav>

  <!-- Экран «заказ принят» -->
  <template x-if="done">
    <section class="card px-5 py-10 text-center sm:px-10 sm:py-14">
      <span class="mx-auto grid size-16 place-items-center rounded-full border border-brand-gold-light bg-brand-gold-soft text-brand-gold">
        <svg class="size-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m5 12 4.5 4.5L19 7"/></svg>
      </span>
      <h1 class="mt-6 font-heading text-[2.5rem] font-medium leading-none">Заказ принят</h1>
      <p class="mt-4 text-sm font-light text-ink-muted">Номер заказа</p>
      <p class="mt-1 font-heading text-[2rem] font-semibold" x-text="`№ ${done.order.order_no}`"></p>
      <p class="mx-auto mt-4 max-w-[30rem] text-[0.8125rem] font-light leading-relaxed text-ink-muted">
        Менеджер свяжется с вами и подтвердит состав и доставку. Оплата — при получении
        или по QR Kaspi после подтверждения, онлайн-оплаты на сайте нет.
      </p>
      <!-- Как узнать, что заказ готов -->
      <div class="mx-auto mt-6 max-w-[30rem] rounded-xl border border-brand-gold-light bg-brand-gold-soft px-4 py-4 text-left text-[0.8125rem] leading-relaxed">
        <p class="font-medium">Как узнать, что заказ готов</p>
        <p class="mt-1 font-light">Статус меняется сам: <b class="font-medium">Принят → Подтверждён → Собран</b>.
          <span x-text="done.order.delivery_method === 'pickup' ? `Когда увидите «Собран» — заказ готов, забирайте: ${$store.contacts.fullAddress}.` : 'Когда увидите «Собран» — заказ готов и скоро уйдёт в доставку.'"></span></p>
        <p class="mt-2 font-light">Проверить статус — кнопка «Следить за заказом» ниже или в разделе «Профиль → Отследить заказ» по номеру
          <b class="font-medium" x-text="`№ ${done.order.order_no}`"></b> и телефону <b class="font-medium" x-text="done.phone"></b>. Сохраните номер заказа.</p>
      </div>
      <dl class="mx-auto mt-6 max-w-[22rem] space-y-1.5 text-left text-sm">
        <div class="flex justify-between"><dt class="font-light text-ink-muted">Товары</dt><dd x-text="$store.fmt.money($store.fmt.tiyn(done.order.items_total))"></dd></div>
        <div class="flex justify-between"><dt class="font-light text-ink-muted">Доставка</dt><dd x-text="done.order.delivery_method === 'pickup' ? 'самовывоз' : $store.fmt.money($store.fmt.tiyn(done.order.delivery))"></dd></div>
        <div class="flex justify-between border-t border-line pt-1.5"><dt>Итого</dt><dd class="font-semibold" x-text="$store.fmt.money($store.fmt.tiyn(done.order.total))"></dd></div>
      </dl>
      <p x-show="done.mismatch" class="mx-auto mt-3 max-w-[30rem] text-xs text-status-confirmed">Пока вы оформляли заказ, цена изменилась — выше актуальная сумма от магазина.</p>
      <div class="mt-8 flex flex-wrap justify-center gap-3">
        <a :href="$store.account.me ? `/account.html?order=${done.order.id}` : `/account.html?order_no=${done.order.order_no}&phone=${encodeURIComponent(done.phone)}`" class="btn-primary">Следить за заказом</a>
        <a href="/catalog.html" class="btn-outline">Вернуться в каталог</a>
      </div>
    </section>
  </template>

  <template x-if="!done">
    <div class="flex flex-col gap-6">
      <h1 class="font-heading text-[clamp(2rem,5vw,2.5rem)] font-medium leading-none">Оформление заказа</h1>

      <!-- @include loading.html -->

      <div x-show="$store.shop.ready && !$store.cart.okLines.length" class="card px-8 py-14 text-center">
        <p class="font-heading text-[1.625rem]">В корзине нет товаров</p>
        <p class="mt-2 text-sm font-light text-ink-muted">Чтобы оформить заказ, добавьте товары из каталога</p>
        <a href="/catalog.html" class="btn-primary mt-6">Перейти в каталог</a>
      </div>

      <div x-show="$store.cart.blocked" x-cloak role="alert" class="rounded-card border border-error/40 bg-error-soft px-5 py-3 text-[0.8125rem] text-error">
        Некоторых товаров из корзины больше нет в наличии. <a href="/cart.html" class="underline underline-offset-4">Вернитесь в корзину</a> и уберите их.
      </div>

      <form x-show="$store.cart.okLines.length" novalidate @submit.prevent="submit()"
            class="grid grid-cols-1 items-start gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(17rem,24rem)]">
        <div class="card flex flex-col gap-6 p-5 sm:p-8">
          <p x-show="!$store.account.me" class="-mb-2 rounded-xl bg-brand-gold-soft/60 px-4 py-3 text-xs font-light text-ink-muted">
            Уже заказывали? <a href="/account.html" class="text-ink underline underline-offset-4 hover:text-brand-gold">Войдите в профиль</a> — данные подставятся сами, а если у вас договорные цены, они применятся к заказу.
          </p>
          <fieldset class="grid grid-cols-1 gap-5 sm:grid-cols-2">
            <legend class="eyebrow mb-5 sm:col-span-2">Контактные данные</legend>
            <label class="flex flex-col gap-2">
              <span class="text-[0.8125rem]">Имя <span class="text-error">*</span></span>
              <input type="text" x-model="form.name" @input="touched && validate()" autocomplete="name"
                     class="field" :class="errors.name && 'is-invalid'" placeholder="Как к вам обращаться"
                     :aria-invalid="!!errors.name" aria-describedby="err-name" />
              <span id="err-name" class="text-xs text-error" x-text="errors.name" x-show="errors.name"></span>
            </label>
            <label class="flex flex-col gap-2">
              <span class="text-[0.8125rem]">Телефон <span class="text-error">*</span></span>
              <input type="tel" x-model="form.phone" @input="formatPhone(); touched && validate()" autocomplete="tel"
                     class="field" :class="errors.phone && 'is-invalid'" placeholder="+7 (7XX) XXX-XX-XX"
                     :aria-invalid="!!errors.phone" aria-describedby="err-phone" />
              <span id="err-phone" class="text-xs text-error" x-text="errors.phone" x-show="errors.phone"></span>
            </label>
          </fieldset>

          <fieldset>
            <legend class="eyebrow mb-4">Способ получения</legend>
            <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4">
              <template x-for="[id, label] in Object.entries(delivery)" :key="id">
                <label class="flex cursor-pointer items-start gap-3 rounded-xl border p-4 transition"
                       :class="form.delivery_method === id ? 'border-brand-gold bg-brand-gold-soft/60' : 'border-line hover:border-brand-gold-light'">
                  <input type="radio" :value="id" x-model="form.delivery_method" class="mt-1 accent-brand-dark" />
                  <span><span class="block text-sm" x-text="label"></span>
                    <span class="text-xs font-light text-ink-muted" x-text="{ pickup: 'Пункт выдачи уточнит менеджер', courier: 'По Астане — 1 200 ₸, другие города — 2 500 ₸', cdek: 'В другие города — 2 500 ₸', kazpost: 'В другие города — 2 500 ₸' }[id]"></span></span>
                </label>
              </template>
            </div>
            <div x-show="form.delivery_method !== 'pickup'" x-cloak class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-[12rem_minmax(0,1fr)]">
              <label class="flex flex-col gap-2">
                <span class="text-[0.8125rem]">Город <span class="text-error">*</span></span>
                <input type="text" x-model="form.city" @input="touched && validate()" autocomplete="address-level2" class="field" :class="errors.city && 'is-invalid'" placeholder="Астана" />
                <span class="text-xs text-error" x-text="errors.city" x-show="errors.city"></span>
              </label>
              <label class="flex flex-col gap-2">
                <span class="text-[0.8125rem]" x-text="form.delivery_method === 'courier' ? 'Адрес доставки *' : 'Адрес или пункт выдачи *'"></span>
                <input type="text" x-model="form.address" @input="touched && validate()" autocomplete="street-address" class="field" :class="errors.address && 'is-invalid'" placeholder="Улица, дом, квартира" />
                <span class="text-xs text-error" x-text="errors.address" x-show="errors.address"></span>
              </label>
            </div>
          </fieldset>

          <label class="flex flex-col gap-2">
            <span class="eyebrow mb-2">Комментарий к заказу</span>
            <textarea x-model="form.comment" rows="4" class="field h-auto py-3" placeholder="Например, удобное время для звонка"></textarea>
          </label>

          <p class="text-xs font-light text-ink-muted"><span class="text-error">*</span> — обязательные поля</p>
        </div>

        <aside class="card p-5 sm:p-6 lg:sticky lg:top-5">
          <h2 class="font-heading text-[1.625rem] font-medium">Ваш заказ</h2>
          <ul class="mt-4 space-y-3 border-b border-line pb-4">
            <template x-for="line in $store.cart.okLines" :key="line.product.id">
              <li class="flex justify-between gap-4 text-[0.8125rem]">
                <span class="min-w-0">
                  <span class="block" x-text="bl.fullName(line.product)"></span>
                  <span class="text-xs font-light text-ink-muted" x-text="`${line.qty} × ${$store.fmt.money(line.price)}`"></span>
                </span>
                <span class="shrink-0" x-text="$store.fmt.money(line.sum)"></span>
              </li>
            </template>
          </ul>
          <dl class="mt-4 space-y-1.5 text-sm">
            <div class="flex justify-between"><dt class="font-light text-ink-muted">Товары</dt><dd x-text="$store.fmt.money($store.cart.total)"></dd></div>
            <div class="flex justify-between"><dt class="font-light text-ink-muted">Доставка</dt><dd x-text="form.delivery_method === 'pickup' ? 'самовывоз' : $store.fmt.money(deliveryTiyn)"></dd></div>
          </dl>
          <div class="mt-3 flex items-baseline justify-between border-t border-line pt-3">
            <span class="text-sm">Итого</span>
            <span class="font-heading text-[2rem] font-semibold" x-text="$store.fmt.money($store.cart.total + deliveryTiyn)"></span>
          </div>
          <p class="mt-1 text-[0.6875rem] font-light text-ink-muted" x-text="form.delivery_method === 'pickup' ? 'Самовывоз — без доставки' : 'По Астане 1 200 ₸, в другие города 2 500 ₸'"></p>
          <p x-show="serverError" x-cloak role="alert" class="mt-4 rounded-xl bg-error-soft px-4 py-3 text-xs text-error" x-text="serverError"></p>
          <button type="submit" class="btn-primary mt-6 w-full max-lg:hidden" :disabled="sending || $store.cart.blocked" x-text="sending ? 'Оформляем…' : 'Оформить'">Оформить</button>
          <p x-show="touched && Object.keys(errors).length" x-cloak class="mt-3 text-center text-xs text-error">Проверьте выделенные поля</p>
          <p class="mt-3 text-center text-[0.6875rem] font-light text-ink-muted">Заказ сразу появится у менеджера в CRM. Оплату отмечает менеджер</p>
          <a href="/cart.html" class="mt-4 block text-center text-xs font-light underline underline-offset-4 hover:text-brand-gold">Вернуться в корзину</a>
        </aside>

        <!-- Узкий экран: итог и кнопка заказа всегда на виду, над нижней панелью (#47) -->
        <div class="h-16 lg:hidden" aria-hidden="true"></div>
        <div class="fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-line bg-surface/95 px-4 py-2.5 shadow-subtle backdrop-blur lg:hidden">
          <p x-show="serverError || (touched && Object.keys(errors).length)" x-cloak role="alert" class="mx-auto mb-1.5 max-w-lg truncate text-[0.6875rem] text-error"
             x-text="serverError || 'Проверьте выделенные поля'"></p>
          <div class="mx-auto flex max-w-lg items-center justify-between gap-3">
            <p class="min-w-0 leading-tight"><span class="block text-[0.6875rem] font-light text-ink-muted" x-text="form.delivery_method === 'pickup' ? 'Итого, самовывоз' : 'Итого с доставкой'"></span>
              <span class="font-heading text-[1.5rem] font-semibold" x-text="$store.fmt.money($store.cart.total + deliveryTiyn)"></span></p>
            <button type="submit" class="btn-primary shrink-0" :disabled="sending || $store.cart.blocked" x-text="sending ? 'Оформляем…' : 'Оформить заказ'">Оформить заказ</button>
          </div>
        </div>
      </form>
    </div>
  </template>
</main>

<!-- @include layout-end.html -->
</body>
</html>
