<!doctype html>
<html lang="ru">
<head>
  <!-- @include head.html -->
  <title>Оформление заказа — Bakeloom</title>
</head>
<body data-page="checkout">
<!-- @include layout-start.html -->

<main x-data="checkoutPage" class="vt-content flex flex-col gap-6">
  <nav class="text-xs font-light text-muted" aria-label="Хлебные крошки">
    <a href="/" class="hover:text-gold">Главная</a> <span class="mx-1.5">/</span>
    <a href="/cart.html" class="hover:text-gold">Корзина</a> <span class="mx-1.5">/</span>
    <span class="text-ink">Оформление</span>
  </nav>

  <!-- Экран «заказ принят» -->
  <template x-if="done">
    <section class="card px-10 py-14 text-center">
      <span class="mx-auto grid size-16 place-items-center rounded-full border border-gold-soft bg-chip text-gold">
        <svg class="size-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m5 12 4.5 4.5L19 7"/></svg>
      </span>
      <h1 class="mt-6 font-serif text-[2.5rem] font-medium leading-none">Заказ принят</h1>
      <p class="mt-4 text-sm font-light text-muted">Номер заказа</p>
      <p class="mt-1 font-serif text-[2rem] font-semibold" x-text="done.number"></p>
      <p class="mx-auto mt-4 max-w-[30rem] text-[0.8125rem] font-light leading-relaxed text-muted">
        <span class="demo-tag mr-1 align-middle">Демо</span>
        Номер-заглушка: заказ никуда не отправлен, backend подключим отдельно.
      </p>
      <p class="mt-6 text-sm" x-text="`${done.lines.length} ${$store.fmt.plural(done.lines.length, 'позиция', 'позиции', 'позиций')} на сумму ${$store.fmt.price(done.total)}`"></p>
      <a href="/catalog.html" class="btn-outline mt-8">Вернуться в каталог</a>
    </section>
  </template>

  <template x-if="!done">
    <div class="flex flex-col gap-6">
      <h1 class="font-serif text-[2.5rem] font-medium leading-none">Оформление заказа</h1>

      <!-- @include loading.html -->

      <div x-show="$store.shop.ready && !$store.cart.lines.length" class="card px-8 py-14 text-center">
        <p class="font-serif text-[1.625rem]">В корзине нет товаров</p>
        <p class="mt-2 text-sm font-light text-muted">Чтобы оформить заказ, добавьте товары из каталога</p>
        <a href="/catalog.html" class="btn-solid mt-6">Перейти в каталог</a>
      </div>

      <form x-show="$store.cart.lines.length" novalidate @submit.prevent="submit()"
            class="grid grid-cols-[minmax(0,1fr)_minmax(17rem,24rem)] items-start gap-6">
        <div class="card flex flex-col gap-6 p-8">
          <fieldset class="grid grid-cols-2 gap-5">
            <legend class="eyebrow mb-5">Контактные данные</legend>
            <label class="flex flex-col gap-2">
              <span class="text-[0.8125rem]">Имя <span class="text-[#b4664a]">*</span></span>
              <input type="text" x-model="form.name" @input="touched && validate()" autocomplete="name"
                     class="field" :class="errors.name && 'is-invalid'" placeholder="Как к вам обращаться"
                     :aria-invalid="!!errors.name" aria-describedby="err-name" />
              <span id="err-name" class="text-xs text-[#b4664a]" x-text="errors.name" x-show="errors.name"></span>
            </label>
            <label class="flex flex-col gap-2">
              <span class="text-[0.8125rem]">Телефон <span class="text-[#b4664a]">*</span></span>
              <input type="tel" x-model="form.phone" @input="formatPhone(); touched && validate()" autocomplete="tel"
                     class="field" :class="errors.phone && 'is-invalid'" placeholder="+7 (7XX) XXX-XX-XX"
                     :aria-invalid="!!errors.phone" aria-describedby="err-phone" />
              <span id="err-phone" class="text-xs text-[#b4664a]" x-text="errors.phone" x-show="errors.phone"></span>
            </label>
          </fieldset>

          <fieldset>
            <legend class="eyebrow mb-4">Способ получения</legend>
            <div class="grid grid-cols-2 gap-4">
              <label class="flex cursor-pointer items-start gap-3 rounded-xl border p-4 transition"
                     :class="form.delivery === 'pickup' ? 'border-gold bg-chip/60' : 'border-line hover:border-gold-soft'">
                <input type="radio" value="pickup" x-model="form.delivery" class="mt-1 accent-[#4a5236]" />
                <span><span class="block text-sm">Самовывоз</span><span class="text-xs font-light text-muted">Адрес уточнит менеджер</span></span>
              </label>
              <label class="flex cursor-pointer items-start gap-3 rounded-xl border p-4 transition"
                     :class="form.delivery === 'delivery' ? 'border-gold bg-chip/60' : 'border-line hover:border-gold-soft'">
                <input type="radio" value="delivery" x-model="form.delivery" class="mt-1 accent-[#4a5236]" />
                <span><span class="block text-sm">Доставка</span><span class="text-xs font-light text-muted">Условия и стоимость сообщит менеджер</span></span>
              </label>
            </div>
            <label x-show="form.delivery === 'delivery'" x-cloak class="mt-4 flex flex-col gap-2">
              <span class="text-[0.8125rem]">Адрес доставки</span>
              <input type="text" x-model="form.address" autocomplete="street-address" class="field" placeholder="Город, улица, дом, квартира" />
            </label>
          </fieldset>

          <label class="flex flex-col gap-2">
            <span class="eyebrow mb-2">Комментарий к заказу</span>
            <textarea x-model="form.comment" rows="4" class="field h-auto py-3" placeholder="Например, удобное время для звонка"></textarea>
          </label>

          <p class="text-xs font-light text-muted"><span class="text-[#b4664a]">*</span> — обязательные поля</p>
        </div>

        <aside class="card sticky top-5 p-6">
          <h2 class="font-serif text-[1.625rem] font-medium">Ваш заказ</h2>
          <ul class="mt-4 space-y-3 border-b border-line pb-4">
            <template x-for="line in $store.cart.lines" :key="line.product.id">
              <li class="flex justify-between gap-4 text-[0.8125rem]">
                <span class="min-w-0">
                  <span class="block" x-text="line.product.name"></span>
                  <span class="text-xs font-light text-muted" x-text="`${line.qty} × ${$store.fmt.price(line.product.price)}`"></span>
                </span>
                <span class="shrink-0" x-text="$store.fmt.price(line.product.price * line.qty)"></span>
              </li>
            </template>
          </ul>
          <div class="mt-4 flex items-baseline justify-between">
            <span class="text-sm">Итого</span>
            <span class="font-serif text-[2rem] font-semibold" x-text="$store.fmt.price($store.cart.total)"></span>
          </div>
          <p class="mt-1 text-[0.6875rem] font-light text-muted">Без учёта доставки — её стоимость сообщит менеджер</p>
          <button type="submit" class="btn-solid mt-6 w-full" :disabled="sending">Оформить</button>
          <p x-show="touched && Object.keys(errors).length" x-cloak class="mt-3 text-center text-xs text-[#b4664a]">Заполните имя и телефон</p>
          <p class="mt-3 text-center text-[0.6875rem] font-light text-muted">Демо: заказ никуда не отправляется</p>
          <a href="/cart.html" class="mt-4 block text-center text-xs font-light underline underline-offset-4 hover:text-gold">Вернуться в корзину</a>
        </aside>
      </form>
    </div>
  </template>
</main>

<!-- @include layout-end.html -->
</body>
</html>
