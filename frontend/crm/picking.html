<!doctype html>
<html lang="ru">
<head>
  <!-- @include crm-head.html -->
  <title>Сборка и выдача — Bakeloom CRM</title>
</head>
<body data-page="picking">
<!-- @include crm-layout-start.html -->

<main id="main" x-data="crmPicking" x-show="$store.crm.ready && !$store.crm.error" x-cloak class="vt-content flex flex-col gap-6 px-4 py-6 sm:px-6 sm:py-8 xl:px-8">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="crm-title text-balance">Сборка и выдача</h1>
      <p class="mt-2 text-[0.8125rem] font-light text-ink-muted">Подтверждённые заказы собираем по полкам. Чего не хватает — отмечаем, менеджер поправит состав. Остаток списывается при выдаче</p>
    </div>
    <button type="button" class="btn-outline btn-s" @click="load()" :disabled="busy">Обновить очередь</button>
  </div>

  <div class="grid grid-cols-1 items-start gap-5 lg:grid-cols-[20rem_minmax(0,1fr)]">
    <!-- Очередь: срочные сверху -->
    <section class="crm-card overflow-hidden">
      <h2 class="crm-h2 px-4 pt-5 sm:px-5" x-text="`Очередь · ${queue.length}`"></h2>
      <ul class="mt-3 divide-y divide-line/70">
        <template x-for="q in queue" :key="q.id">
          <li class="scroll-mt-20">
            <button type="button" class="block w-full px-4 py-3 text-left transition hover:bg-brand-light sm:px-5" :class="selected === q.id && 'bg-brand-light shadow-[inset_3px_0_0_var(--color-brand-gold)]'"
                    @click="choose(q.id, $el)" :aria-expanded="!wide && selected === q.id">
              <div class="flex items-center justify-between gap-3">
                <span class="font-semibold" x-text="`№ ${q.order_no}`"></span>
                <span class="flex gap-1.5">
                  <span x-show="q.is_urgent" class="crm-badge bg-error text-surface">Срочно</span>
                  <span x-show="q.is_problem" class="crm-badge bg-status-confirmed-soft text-status-confirmed">Нехватка</span>
                  <span class="crm-badge" :class="$store.crm.statuses[q.status].badge" x-text="q.status === 'confirmed' ? `Собрать ${progress(q)}` : 'Выдать'"></span>
                </span>
              </div>
              <p class="mt-1 flex items-center justify-between gap-2 text-[0.75rem] text-ink-muted"><span x-text="`${q.client_name} · ${deliveryNames[q.delivery_method]}${q.city ? ', ' + q.city : ''}`"></span>
                <svg x-show="!wide" class="size-4 shrink-0 transition-transform" :class="selected === q.id && 'rotate-180'" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></p>
            </button>
            <!-- Телефон: состав заказа раскрывается прямо под ним -->
            <template x-if="!wide && selected === q.id">
              <div class="border-t border-line/70 bg-surface px-4 py-4">
                <!-- @include crm-picking-order.html -->
              </div>
            </template>
          </li>
        </template>
        <li x-show="!loading && !queue.length" class="px-5 py-10 text-center text-[0.8125rem] text-ink-muted">Очередь пуста</li>
        <li x-show="loading" class="px-5 py-10 text-center text-[0.8125rem] text-ink-muted">Загружаем…</li>
      </ul>
    </section>

    <section x-show="wide" class="crm-card p-4 sm:p-6">
      <p x-show="!o" class="py-10 text-center text-[0.8125rem] text-ink-muted">Выберите заказ слева</p>
      <!-- @include crm-picking-order.html -->
    </section>
  </div>
</main>

<!-- @include crm-layout-end.html -->
</body>
</html>
