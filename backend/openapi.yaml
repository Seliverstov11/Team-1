openapi: "3.0.3"
info:
  title: Сладкий Мастер API
  version: "0.1.0"
  description: |
    REST API интернет-магазина товаров для кондитеров.
    На этом контракте строятся сайт, CRM и мобильная практика (H7).

    Деньги и количества передаются строкой — «1880.00», «2.500».
    Строкой, а не числом, чтобы JSON-парсер не превратил их во float
    и не вернул 1879.9999999998. Валюта — тенге.

    Товары с префиксом [ДЕМО] — тестовые данные, не ассортимент заказчика.

servers:
  - url: http://localhost:8080
    description: Локальная разработка

tags:
  - name: catalog
    description: Каталог — публичная часть, нужна сайту
  - name: orders
    description: Заказы — рабочее место менеджера
  - name: warehouse
    description: Склад — рабочее место кладовщика

paths:
  /health:
    get:
      summary: Проверка живости
      responses:
        "200":
          description: Сервис отвечает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /api/catalog/categories:
    get:
      tags: [catalog]
      summary: Список категорий
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }

  /api/catalog/products:
    get:
      tags: [catalog]
      summary: Список товаров
      description: Архивные товары не отдаются никогда.
      parameters:
        - name: category_id
          in: query
          schema: { type: string }
        - name: group_id
          in: query
          description: Варианты одного товара — всё, что показывается одной карточкой
          schema: { type: string }
        - name: client_id
          in: query
          description: Под каким клиентом смотрим каталог — для его персональных цен
          schema: { type: string }
        - name: search
          in: query
          description: Поиск по названию или артикулу
          schema: { type: string }
        - name: in_stock
          in: query
          description: true — только то, что доступно к заказу
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }

  /api/catalog/products/{id}:
    get:
      tags: [catalog]
      summary: Товар по идентификатору
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404":
          description: Не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/orders:
    get:
      tags: [orders]
      summary: Список заказов
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [new, confirmed, assembling, ready, delivered, cancelled]
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }

    post:
      tags: [orders]
      summary: Создать заказ
      description: |
        Резервирует остатки одной транзакцией. Если хотя бы одной позиции
        не хватает, не резервируется ничего и заказ не создаётся —
        два одновременных заказа не уведут остаток в минус.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrder" }
      responses:
        "200":
          description: Заказ создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDetail" }
        "400":
          description: >
            Пустой заказ, нет товара, не хватает остатка, количество меньше
            минимального или не кратно шагу
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: "«Шоколад тёмный 54%»: доступно 21.500, запрошено 30"

  /api/orders/{id}:
    get:
      tags: [orders]
      summary: Заказ с составом
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDetail" }
        "404":
          description: Не найден

    patch:
      tags: [orders]
      summary: Сменить статус заказа
      description: |
        `cancelled` снимает резерв, склад не трогает.
        `handed_over` и дальше — списывает остаток и снимает резерв.
        Повторное списание по тому же заказу не выполняется.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderStatus" }
      responses:
        "200":
          description: Статус изменён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: Неизвестный статус
        "404":
          description: Не найден

  /api/orders/{id}/payment:
    post:
      tags: [orders]
      summary: Подтвердить оплату
      description: |
        Оплату проставляет человек. QR Kaspi у заказчика статический,
        уведомления о платеже система не получает, поэтому автоматической
        отметки «оплачен» не существует и быть не может.

        Возврат принимается только по оплаченному заказу: возвращать
        нечего, если денег не было.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmPayment" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: Возврат без оплаты, сумма больше итога или онлайн-оплата
        "404":
          description: Не найден

  /api/warehouse/stock:
    get:
      tags: [warehouse]
      summary: Остатки по всем товарам
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StockLevel" }

  /api/warehouse/movements:
    get:
      tags: [warehouse]
      summary: Журнал движений, последние 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Movement" }

    post:
      tags: [warehouse]
      summary: Приход или корректировка
      description: |
        Резервом отсюда управлять нельзя — он живёт по заказам.
        Остаток не опустится ниже нуля и ниже уже зарезервированного.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMovement" }
      responses:
        "200":
          description: Движение записано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Movement" }
        "400":
          description: Неверный тип или остаток уйдёт в минус
        "404":
          description: Товар не найден

components:
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: "Ингредиенты" }
        slug: { type: string, example: "ingredients" }
        parent_id: { type: string, nullable: true }
        sort_order: { type: integer }
        created_at: { type: string, example: "2026-11-12T10:00:00Z" }

    Product:
      type: object
      properties:
        id: { type: string }
        category_id: { type: string }
        name: { type: string, example: "Шоколад тёмный 54%, каллеты" }
        sku: { type: string, nullable: true, example: "CB-54-1KG" }
        description: { type: string, nullable: true }
        price:
          type: string
          example: "1880.00"
          description: Тенге, строкой
        unit: { type: string, example: "кг" }
        is_weight:
          type: boolean
          description: true — продаётся на вес, количество может быть дробным
        stock_qty: { type: string, example: "24.000" }
        available_qty:
          type: string
          example: "21.500"
          description: Остаток за вычетом резервов — сколько реально можно заказать
        min_order:
          type: string
          example: "0.500"
          description: Минимальное количество в заказе
        order_step:
          type: string
          example: "0.100"
          description: Шаг изменения количества, отсчитывается от min_order
        attributes:
          type: array
          description: >
            Характеристики произвольные, набор свой у каждого товара —
            заказчик заводит новые при добавлении товара. Фиксированного
            списка полей нет.
          items: { $ref: "#/components/schemas/Attribute" }
        image_url: { type: string, nullable: true }
        is_archived: { type: boolean }
        group_id:
          type: string
          nullable: true
          example: "g-cho-d54"
          description: >
            Варианты одного товара (100 г / 500 г / 1 кг) делят общий group_id.
            Карточка на сайте одна, внутри переключатель; у каждого варианта
            своя цена и свой остаток.
        variant_name: { type: string, nullable: true, example: "500 г" }
        wholesale_price:
          type: string
          nullable: true
          example: "4500.00"
          description: Оптовая цена, действует от wholesale_min_qty единиц
        wholesale_min_qty: { type: integer, nullable: true, example: 10 }
        storage_location:
          type: string
          nullable: true
          example: "Склад А / стеллаж 1 / полка 2"
          description: Адресное хранение, заполняется при приёмке вручную
        personal_price:
          type: string
          nullable: true
          example: "3000.00"
          description: >
            Цена этого клиента, если запрос пришёл с client_id и цена
            заведена. Показывать её вместо розничной.
        image_name:
          type: string
          nullable: true
          example: "CHO-D54-500.jpg"
          description: >
            Имя будущего файла фотографии из таблицы заказчика. Сами фото
            подбирает команда, в каталоге их пока нет.

    Attribute:
      type: object
      properties:
        name: { type: string, example: "Какао" }
        value: { type: string, example: "54,5 %" }

    Order:
      type: object
      properties:
        id: { type: string }
        client_id: { type: string, nullable: true }
        client_name: { type: string }
        client_phone: { type: string, nullable: true }
        order_no: { type: string, nullable: true, example: "1041" }
        status:
          type: string
          enum: [new, confirmed, assembled, handed_over, shipped, delivered, completed, cancelled]
          description: >
            Резерв ставится при создании заказа. Списание со склада —
            при передаче в доставку или выдаче, то есть на handed_over
            и далее; повторно не выполняется.
        items_total: { type: string, example: "25200.00" }
        delivery: { type: string, example: "1200.00" }
        total: { type: string, example: "26400.00" }
        paid:
          type: string
          example: "26400.00"
          description: >
            Сколько фактически получено. Онлайн-оплаты нет: QR Kaspi
            статический, систему о платеже никто не уведомляет,
            поэтому факт оплаты проставляет менеджер.
        channel:
          type: string
          enum: [site, site_legacy, whatsapp, instagram, phone, other]
        city: { type: string, nullable: true, example: "Астана" }
        delivery_method:
          type: string
          enum: [pickup, courier, cdek, kazpost]
        delivery_address: { type: string, nullable: true }
        payment_method:
          type: string
          enum: [none, cash, kaspi_transfer, online]
        payment_status:
          type: string
          enum: [unpaid, paid, refunded]
        note: { type: string, nullable: true }
        source:
          type: string
          nullable: true
          enum: [site, whatsapp, phone, other]
        assigned_to: { type: string, nullable: true }
        cancelled_reason: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }

    OrderItem:
      type: object
      description: Название и цена — снимок на момент заказа, задним числом не меняются.
      properties:
        id: { type: string }
        product_id: { type: string, nullable: true }
        product_name: { type: string }
        product_sku: { type: string, nullable: true }
        unit: { type: string }
        price: { type: string, example: "1880.00" }
        quantity: { type: string, example: "2.500" }
        discount_percent:
          type: integer
          example: 0
          description: Скидка по строке. Промокодов в магазине нет, скидка — ручная.
        price_kind:
          type: string
          nullable: true
          enum: [retail, wholesale, personal]
          description: По какой из трёх цен посчитана строка
        subtotal: { type: string, example: "4700.00" }

    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/OrderItem" }

    CreateOrder:
      type: object
      required: [client_name, client_phone, items]
      description: |
        Цену строки считает бэкенд, фронт её не присылает: берётся
        персональная цена клиента, иначе оптовая по количеству, иначе
        розничная. Что именно применилось — в `price_kind` строки заказа.
      properties:
        client_name: { type: string }
        client_phone:
          type: string
          description: Обязателен — заказчик просил имя, телефон и адрес на оформлении
        client_id:
          type: string
          description: Известный клиент, к нему применяются его персональные цены
        source:
          type: string
          enum: [site, whatsapp, instagram, phone, other]
        city: { type: string, example: "Астана" }
        delivery_method:
          type: string
          enum: [pickup, courier, cdek, kazpost]
          default: pickup
        delivery_address:
          type: string
          description: Адрес или пункт выдачи. Для всего, кроме самовывоза, обязателен
        delivery:
          type: string
          example: "1200.00"
          description: >
            Стоимость доставки строкой. Бэкенд её не рассчитывает: служб
            доставки и тарифов заказчик пока не назвал.
        payment_method:
          type: string
          enum: [none, cash, kaspi_transfer]
          default: none
          description: Онлайн-оплата отбивается с ошибкой — её в магазине нет
        note: { type: string }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: string }
              quantity:
                type: string
                example: "2.5"
                description: Строкой, до трёх знаков после точки

    ConfirmPayment:
      type: object
      required: [payment_status]
      properties:
        payment_status:
          type: string
          enum: [unpaid, paid, refunded]
        payment_method:
          type: string
          enum: [none, cash, kaspi_transfer]
        paid:
          type: string
          example: "26400.00"
          description: >
            Сколько получено. Без этого поля при `paid` проставляется
            весь итог заказа. Больше итога не принимается.

    UpdateOrderStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new, confirmed, assembling, ready, delivered, cancelled]
        cancelled_reason: { type: string }
        assigned_to: { type: string }

    StockLevel:
      type: object
      properties:
        product_id: { type: string }
        product_name: { type: string }
        sku: { type: string, nullable: true }
        unit: { type: string }
        stock_qty: { type: string }
        reserved_qty: { type: string }
        available_qty: { type: string }
        min_stock_qty: { type: string, nullable: true }
        low_stock:
          type: boolean
          description: Доступно меньше минимального остатка — пора заказывать
        storage_location:
          type: string
          nullable: true
          example: "A-03"
          description: Полка на складе. Сканера нет, кладовщик ищет по ней

    Movement:
      type: object
      properties:
        id: { type: string }
        product_id: { type: string }
        movement_type:
          type: string
          enum: [in, out, adjustment, reserve, unreserve]
        quantity:
          type: string
          description: Со знаком. Минус — расход или снятие резерва
          example: "-2.500"
        reason: { type: string, nullable: true }
        order_id: { type: string, nullable: true }
        employee_id: { type: string, nullable: true }
        storage_location: { type: string, nullable: true }
        created_at: { type: string }

    CreateMovement:
      type: object
      required: [product_id, movement_type, quantity]
      properties:
        product_id: { type: string }
        movement_type:
          type: string
          enum: [in, out, adjustment]
          description: reserve и unreserve создаются только заказами
        quantity:
          type: string
          example: "40"
          description: Для adjustment допустим минус в начале
        reason: { type: string, example: "накладная КО-2214" }
        employee_id: { type: string }
        storage_location:
          type: string
          example: "D-02"
          description: Куда положили. Не передали — остаётся прежняя полка
